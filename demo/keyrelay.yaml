listen: ":8443"

tls:
  cert_file: /certs/keyrelay.crt
  key_file: /certs/keyrelay.key
  client_ca_file: /certs/ca.crt        # only agents signed by this CA can connect

vault:
  address: http://vault:8200
  timeout: 5s
  approle:
    mount: approle
    role_id_file: /bootstrap/role_id
    secret_id_file: /bootstrap/secret_id

cache:
  ttl: 60s

routes:
  - name: weather
    upstream: http://mock-upstream:9000/weather
    allow_insecure_upstream: true      # demo network only; use https in production
    secret: { mount: secret, path: keyrelay/weather, key: api_key }
    inject:
      header: Authorization
      prefix: "Bearer "
      strip: [X-Api-Key]
    allow:
      - spiffe://demo.keyrelay/agent/weather-bot

  - name: payments
    upstream: http://mock-upstream:9000/payments
    allow_insecure_upstream: true
    secret: { mount: secret, path: keyrelay/payments, key: api_key }
    allow:
      - spiffe://demo.keyrelay/workload/billing
